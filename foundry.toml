[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC_URL}"
xlayer_mainnet = "${XLAYER_MAINNET_RPC_URL}"

